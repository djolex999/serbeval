# OFFICIAL SET (generated by scripts/build_official_tasks.py from srb_cyrillic_agreement.yaml).
# Items and their verification status: data/official/MANIFEST.json
task: srb_cyrillic_agreement_official
tag: srb_official
dataset_path: json
dataset_kwargs:
  data_files:
    test: data/official/srb_cyrillic_agreement.jsonl
test_split: test
output_type: generate_until
doc_to_text: !function utils.doc_to_text
doc_to_target: !function utils.doc_to_target
process_results: !function utils.process_results_pair
generation_kwargs:
  until:
    - "\n\n"
  max_gen_toks: 32
  do_sample: false
  temperature: 0.0
filter_list:
  - name: extract_answer
    filter:
      - function: regex
        regex_pattern: "\\b([ABCD])\\b"
      - function: take_first
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
  - metric: unparsed
    aggregation: mean
    higher_is_better: false
  - metric: pair_agreement
    aggregation: !function utils.pair_agreement
    higher_is_better: true
metadata:
  version: 0.1
