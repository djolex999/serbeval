task: srb_idioms
dataset_path: json
dataset_kwargs:
  data_files:
    test: data/srb_idioms/items.jsonl
test_split: test
output_type: generate_until
doc_to_text: !function utils.doc_to_text
doc_to_target: !function utils.doc_to_target
generation_kwargs:
  until:
    - "\n\n"
  max_gen_toks: 32
  do_sample: false
  temperature: 0.0
filter_list:
  - name: extract_answer
    filter:
      - function: regex
        regex_pattern: "\\b([ABCD])\\b"
      - function: take_first
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
    ignore_case: true
    ignore_punctuation: true
metadata:
  version: 0.1
