* { box-sizing: border-box; }

main { max-width: 900px; margin: 0 auto; padding: 16px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
.meta { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.status { font-weight: 650; }
.sentence { font-size: 22px; line-height: 1.45; margin: 14px 0 6px; }

.original { color: var(--muted); font-size: 14px; }
.cue { display: inline-block; border: 1px solid var(--line); border-radius: 99px; padding: 1px 10px; margin-left: 6px; }
.choices { list-style: none; padding: 0; margin: 12px 0; display: grid; gap: 6px; }
.choices li { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
.choices li.gold { background: var(--gold-bg); border-color: var(--gold-line); font-weight: 600; }
.gold-box { background: var(--gold-bg); border: 1px solid var(--gold-line); border-radius: 10px; padding: 10px 14px; margin: 12px 0; }
.gold-box b { font-size: 18px; }
.explain { color: var(--muted); }
.actions { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; margin-top: 16px; }
.actions button { padding: 10px 6px; font-weight: 600; }
.actions kbd { display: block; font: 12px ui-monospace, monospace; color: var(--muted); font-weight: 400; }
.a-ok { color: var(--ok); } .a-fix { color: var(--fix); } .a-add { color: var(--add); }
.a-unsure { color: var(--unsure); } .a-drop { color: var(--drop); }
.actions button.on { outline: 2px solid currentColor; }
.editor { display: none; gap: 8px; margin-top: 12px; align-items: center; flex-wrap: wrap; }
.editor.open { display: flex; }
.editor input { flex: 1 1 240px; }
.letters button { min-width: 44px; }
.nav { display: flex; justify-content: space-between; gap: 8px; margin-top: 14px; }
.dots { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 18px; }
.dots button { width: 14px; height: 14px; padding: 0; border-radius: 4px; background: var(--line); border: 0; }
.dots button.cur { outline: 2px solid var(--ink); }
.dots .k-ok { background: var(--ok); } .dots .k-fix { background: var(--fix); } .dots .k-add { background: var(--add); }
.dots .k-unsure { background: var(--unsure); } .dots .k-drop { background: var(--drop); }
.help { font-size: 13px; color: var(--muted); margin-top: 14px; }
.toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg);
  padding: 8px 14px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }
@media (max-width: 560px) {
  .actions { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .sentence { font-size: 19px; }
}
</style>

„Celo popodne sedeli smo ____ i razgovarali.“", "choices": ["u baštu", "na baštu", "u baštom", "u bašti"], "gold": ["D"], "explanation": "Glagol „sedeti“ označava mirovanje, pa posle predloga „u“ dolazi lokativ („u bašti“); akuzativ „u baštu“ tražio bi glagol kretanja."}, {"id": "srb-cloze-padezi-0003", "task": "srb_grammar_cloze", "category": "padezi", "kind": "cloze", "question": "Svi su se divili njenoj ____.", "cue": "hrabrost", "gold": ["hrabrosti"], "filled": "Svi su se divili njenoj hrabrosti.", "explanation": "Glagol „diviti se“ ima dativnu rekciju."}, {"id": "srb-idioms-idiomi-c-0008", "task": "srb_idioms", "category": "idiomi-c", "kind": "mcq", "question": "Kada kažemo da neka tvrdnja ili izgovor „ne drži vodu\", mislimo da je ta tvrdnja:", "choices": ["tajna i poverljiva", "potpuno tačna i dokazana", "previše dugačka i zamorna", "neuverljiva i logički neodrživa"], "gold": ["D"], "explanation": "„Ne drži vodu\" znači da je nešto neutemeljeno, da ne može da izdrži proveru i da je neodrživo."}, {"id": "srb-cyrillic-agreement-geografija-0009-lat", "task": "srb_cyrillic_agreement", "category": "geografija", "kind": "mcq", "question": "Koji je najveći okean na Zemlji?", "choices": ["Atlantski", "Indijski", "Severni ledeni", "Tihi"], "gold": ["D"], "explanation": "Činjenično pitanje; tačan odgovor je nezavisan od pisma."}, {"id": "srb-grammar-pravopis-0003", "task": "srb_grammar", "category": "pravopis", "kind": "mcq", "question": "Koja rečenica sadrži pravopisno ispravno napisanu upitnu rečcu?", "choices": ["Dali ćeš doći na sastanak sutra ujutru?", "Da li ćeš doći na sastanak sutra ujutru?", "Da-li ćeš doći na sastanak sutra ujutru?", "Dal' ćeš doći na sastanak sutra ujutru?"], "gold": ["B"], "explanation": "Upitna rečca \"li\" piše se odvojeno, pa je pravilno \"da li\"; spojeno \"dali\" je glagolski oblik, a \"dal'\" je nestandardna skraćenica."}, {"id": "srb-cloze-brojevi-0010", "task": "srb_grammar_cloze", "category": "brojevi", "kind": "cloze", "question": "U sobi je bilo dvadeset i jedan ____.", "cue": "student", "gold": ["student"], "filled": "U sobi je bilo dvadeset i jedan student.", "explanation": "Brojevi koji se završavaju na 1 (osim 11) traže nominativ jednine."}, {"id": "srb-idioms-idiomi-a-0009", "task": "srb_idioms", "category": "idiomi-a", "kind": "mcq", "question": "Šta znači izraz „praviti se Tošo\"?", "choices": ["Ponašati se otmeno i uzdržano u društvu", "Pretvarati se da se ništa ne događa, glumiti neznanje", "Govoriti na izveštačen, kitnjast način", "Truditi se da se uklopi u strano okruženje"], "gold": ["B"], "explanation": "Izraz „praviti se Tošo\" znači praviti se nevešt, glumiti da nešto ne primećujemo ili ne razumemo. Ostala tumačenja su pogrešna."}, {"id": "srb-cyrillic-agreement-geografija-0007-lat", "task": "srb_cyrillic_agreement", "category": "geografija", "kind": "mcq", "question": "U kojoj se državi nalazi grad Pariz?", "choices": ["Italija", "Španija", "Francuska", "Nemačka"], "gold": ["C"], "explanation": "Činjenično pitanje; tačan odgovor je nezavisan od pisma."}, {"id": "srb-grammar-standard-0002", "task": "srb_grammar", "category": "standard", "kind": "mcq", "question": "U kojoj je rečenici pravilno upotrebljen izraz uz reč 'veza'?", "choices": ["Javiću ti se u vezi toga sutra.", "Javiću ti se u vezi tog sutra.", "Javiću ti se vezano toga sutra.", "Javiću ti se u vezi s tim sutra."], "gold": ["D"], "explanation": "Pravilno je 'u vezi s tim' (predlog 's' + instrumental), a ne 'u vezi toga'."}, {"id": "srb-cloze-glagolski-oblici-0020", "task": "srb_grammar_cloze", "category": "glagolski-oblici", "kind": "cloze", "question": "Ona je ____ kolače celo popodne.", "cue": "peći", "gold": ["pekla"], "filled": "Ona je pekla kolače celo popodne.", "explanation": "Radni glagolski pridev od „peći“ je „pekao/pekla“ (k se čuva)."}, {"id": "srb-idioms-idiomi-b-0001", "task": "srb_idioms", "category": "idiomi-b", "kind": "mcq", "question": "Koja je rečenica pravopisno i gramatički ispravna?", "choices": ["Nemoj da doljevaš ulje na vatru, dosta je svađe za danas.", "Nemoj da dolivaš ulje na vatru, dosta je svađe za danas.", "Nemoj da dolivaš ulje na vatri, dosta je svađe za danas.", "Nemoj da do livaš ulje na vatru, dosta je svađe za danas."], "gold": ["B"], "explanation": "Ekavski oblik glagola je „dolivati“ (dolivaš), izraz traži akuzativ pravca „na vatru“, a glagol se piše spojeno."}, {"id": "srb-cyrillic-agreement-priroda-0011-lat", "task": "srb_cyrillic_agreement", "category": "priroda", "kind": "mcq", "question": "Koja boja nastaje mešanjem plave i žute boje?", "choices": ["zelena", "ljubičasta", "narandžasta", "braon"], "gold": ["A"], "explanation": "Činjenično pitanje; tačan odgovor je nezavisan od pisma."}, {"id": "srb-grammar-standard-0007", "task": "srb_grammar", "category": "standard", "kind": "mcq", "question": "U kojoj je rečenici glagol 'trebati' upotrebljen bezlično, kako tradicionalna norma savetuje, s imeničkom dopunom 'pomoć'?", "choices": ["Trebam pomoć oko selidbe.", "Trebam pomoći oko selidbe.", "Treba mi pomoć oko selidbe.", "Treba da mi pomoć oko selidbe."], "gold": ["C"], "explanation": "Po tradicionalnoj normi glagol 'trebati' s imeničkom dopunom upotrebljava se bezlično u dativu: 'treba mi pomoć', a ne lično 'trebam pomoć'."}, {"id": "srb-cloze-padezi-0004", "task": "srb_grammar_cloze", "category": "padezi", "kind": "cloze", "question": "Bavi se ____ već deset godina.", "cue": "fudbal", "gold": ["fudbalom"], "filled": "Bavi se fudbalom već deset godina.", "explanation": "Glagol „baviti se“ traži instrumental bez predloga."}, {"id": "srb-idioms-idiomi-c-0001", "task": "srb_idioms", "category": "idiomi-c", "kind": "mcq", "question": "Šta znači izraz „doći na zelenu granu\"?", "choices": ["postići uspeh, materijalno se oporaviti i osigurati", "naglo se razboleti", "otići u prirodu na odmor", "ostariti i otići u penziju"], "gold": ["A"], "explanation": "Frazeologizam „doći (izaći) na zelenu granu\" znači postići napredak, finansijski se osoviti na noge i steći sigurnost."}, {"id": "srb-cyrillic-agreement-matematika-0002-lat", "task": "srb_cyrillic_agreement", "category": "matematika", "kind": "mcq", "question": "Koliko iznosi zbir brojeva 25 i 17?", "choices": ["42", "32", "43", "52"], "gold": ["A"], "explanation": "Činjenično pitanje; tačan odgovor je nezavisan od pisma."}, {"id": "srb-grammar-pravopis-0007", "task": "srb_grammar", "category": "pravopis", "kind": "mcq", "question": "U kojoj je rečenici negacija uz glagol napisana pravopisno ispravno?", "choices": ["Ja ne znam te ljude i neću da idem tamo.", "Ja nezvam te ljude i nehhoću da idem tamo.", "Ja neznam te ljude i ne ću da idem tamo.", "Ja ne znam te ljude i ne ću da idem tamo."], "gold": ["A"], "explanation": "Rečca \"ne\" piše se odvojeno od glagola (ne znam), izuzev kod oblika glagola \"hteti\" gde je negacija srasla: \"neću\" se piše sastavljeno."}, {"id": "srb-cloze-komparacija-0015", "task": "srb_grammar_cloze", "category": "komparacija", "kind": "cloze", "question": "On je ____ od svog brata.", "cue": "visok", "gold": ["viši"], "filled": "On je viši od svog brata.", "explanation": "Komparativ od „visok“ je „viši“, ne „visokiji“."}, {"id": "srb-idioms-idiomi-a-0006", "task": "srb_idioms", "category": "idiomi-a", "kind": "mcq", "question": "Šta znači izraz „nositi glavu u torbi\"?", "choices": ["Stalno biti rasejan i zaboravan", "Donositi odluke brzopleto, bez razmišljanja", "Izlagati se velikoj, smrtnoj opasnosti", "Brinuti istovremeno o previše stvari"], "gold": ["C"], "explanation": "Izraz znači dovoditi sopstveni život u opasnost, rizikovati glavu. Distraktori nude uverljiva ali netačna tumačenja."}, {"id": "srb-cyrillic-agreement-priroda-0012-cyr", "task": "srb_cyrillic_agreement", "category": "priroda", "kind": "mcq", "question": "Колико ногу има одрасли паук?", "choices": ["шест", "осам", "десет", "дванаест"], "gold": ["B"], "explanation": "Чињенично питање; тачан одговор је независан од писма."}, {"id": "srb-grammar-enklitike-0004", "task": "srb_grammar", "category": "enklitike", "kind": "mcq", "question": "Koja rečenica ima pravilan redosled kada se jave i rečca „li“ i glagolska enklitika?", "choices": ["Da li mi ćeš pomoći oko selidbe?", "Da li ćeš mi pomoći oko selidbe?", "Da ćeš li mi pomoći oko selidbe?", "Da li ćeš pomoći mi oko selidbe?"], "gold": ["B"], "explanation": "Redosled je „li“ pre glagolske enklitike, pa pre dativske: „li ćeš mi“, dakle „Da li ćeš mi pomoći“."}, {"id": "srb-cloze-brojevi-0008", "task": "srb_grammar_cloze", "category": "brojevi", "kind": "cloze", "question": "U štali smo videli pet ____.", "cue": "konj", "gold": ["konja"], "filled": "U štali smo videli pet konja.", "explanation": "Uz brojeve od 5 naviše imenica ide u genitivu množine."}, {"id": "srb-idioms-idiomi-b-0004", "task": "srb_idioms", "category": "idiomi-b", "kind": "mcq", "question": "U kojoj je rečenici izraz pravilno upotrebljen?", "choices": ["Tom izjavom je našem timu bacio rukavicu u lice.", "Tom izjavom je našem timu bacio rukavice u lice.", "Tom izjavom je našem timu bacao rukavicu u lice.", "Tom izjavom je našem timu frljnuo rukavicu u lice."], "gold": ["A"], "explanation": "Frazeologizam glasi „baciti rukavicu“ (jednina, svršeno), pa je pravilno „bacio rukavicu“; množina i nesvršeno „bacao“ ne odgovaraju ustaljenom obliku."}, {"id": "srb-cyrillic-agreement-matematika-0003-lat", "task": "srb_cyrillic_agreement", "category": "matematika", "kind": "mcq", "question": "Koliko iznosi sto podeljeno sa četiri?", "choices": ["dvadeset", "trideset", "dvadeset pet", "pedeset"], "gold": ["C"], "explanation": "Činjenično pitanje; tačan odgovor je nezavisan od pisma."}, {"id": "srb-grammar-pravopis-0002", "task": "srb_grammar", "category": "pravopis", "kind": "mcq", "question": "U kojoj je rečenici futur I napisan pravopisno ispravno?", "choices": ["Ja ću da radim, a ti ćeš da pišeš ceo dan.", "Ja radiću, a ti ćeš pisati ceo dan jer ce biti vremena.", "Ja ću raditi, a ti ćeš pisati ceo dan.", "Ja ću radit, a ti ćeš pisat ceo dan."], "gold": ["C"], "explanation": "Kad infinitiv stoji ispred pomoćnog glagola gubi se krajnje -i i piše se sastavljeno (radiću), ali kad pomoćni glagol stoji ispred, piše se rastavljeno: \"ću raditi\". Oblici \"radit/pisat\" bez krajnjeg -i nisu standardni."}, {"id": "srb-cloze-komparacija-0013", "task": "srb_grammar_cloze", "category": "komparacija", "kind": "cloze", "question": "Ona je ____ učenica u razredu.", "cue": "dobar", "gold": ["najbolja"], "filled": "Ona je najbolja učenica u razredu.", "explanation": "Superlativ od „dobar“ je supletivan: „najbolji“, ovde u ženskom rodu."}, {"id": "srb-idioms-idiomi-a-0008", "task": "srb_idioms", "category": "idiomi-a", "kind": "mcq", "question": "Šta znači izraz „praviti od muve slona\"?", "choices": ["Mnogo preuveličavati sitan problem ili događaj", "Stvarati nešto veliko i vredno ni od čega", "Baviti se beskorisnim, sitničavim poslom", "Spajati nespojive stvari u jednu celinu"], "gold": ["A"], "explanation": "Izraz znači preterano uveličavati beznačajnu, sitnu stvar. Distraktori nude izvrnuto ili doslovno tumačenje."}, {"id": "srb-cyrillic-agreement-opste-0014-cyr", "task": "srb_cyrillic_agreement", "category": "opste", "kind": "mcq", "question": "Колико месеци има једна година?", "choices": ["десет", "дванаест", "једанаест", "тринаест"], "gold": ["B"], "explanation": "Чињенично питање; тачан одговор је независан од писма."}, {"id": "srb-grammar-padezi-0003", "task": "srb_grammar", "category": "padezi", "kind": "mcq", "question": "U kojoj je rečenici padež posle predloga upotrebljen pravilno?", "choices": ["Posle ručka odlazimo u pozorište.", "Posle ručka odlazimo u pozorištu.", "Posle ručka odlazimo na pozorištu.", "Posle ručka odlazimo u pozorištem."], "gold": ["A"], "explanation": "Glagol „odlaziti“ označava kretanje ka cilju, pa posle „u“ ide akuzativ „u pozorište“; lokativ „u pozorištu“ označavao bi mirovanje na tom mestu."}, {"id": "srb-cloze-glagolski-oblici-0017", "task": "srb_grammar_cloze", "category": "glagolski-oblici", "kind": "cloze", "question": "Kada ____, javi mi se.", "cue": "stići", "gold": ["stigneš", "budeš stigao"], "filled": "Kada stigneš, javi mi se.", "explanation": "Uz vremensku klauzu za budućnost ide prezent svršenog glagola ili futur drugi."}, {"id": "srb-idioms-idiomi-b-0002", "task": "srb_idioms", "category": "idiomi-b", "kind": "mcq", "question": "Dopunite frazeologizam: „Ceo dan je samo ____ praznu slamu i ništa korisno nije uradio.“", "choices": ["mlatijo", "mljatio", "mlatil", "mlatio"], "gold": ["D"], "explanation": "Radni glagolski pridev muškog roda glasi „mlatio“; oblici „mlatijo“ i „mlatil“ su nestandardni, a „mljatio“ je nepostojeća jotovana varijanta."}, {"id": "srb-cyrillic-agreement-geografija-0006-cyr", "task": "srb_cyrillic_agreement", "category": "geografija", "kind": "mcq", "question": "Који је главни град Србије?", "choices": ["Београд", "Нови Сад", "Ниш", "Крагујевац"], "gold": ["A"], "explanation": "Чињенично питање; тачан одговор је независан од писма."}, {"id": "srb-grammar-enklitike-0006", "task": "srb_grammar", "category": "enklitike", "kind": "mcq", "question": "Dopunite prazninu pravilnim redosledom enklitika: „Marko ____ predstavio na sastanku.“", "choices": ["mi je ga", "je mi ga", "ga mi je", "mi ga je"], "gold": ["D"], "explanation": "U nizu enklitika dativska zamenica (mi) prethodi akuzativskoj (ga), a pomoćni glagol „je“ kao jedini izuzetak ide na kraj niza, pa je pravilan redosled „mi ga je“."}, {"id": "srb-cloze-brojevi-0011", "task": "srb_grammar_cloze", "category": "brojevi", "kind": "cloze", "question": "Stigla su tri ____ iz inostranstva.", "cue": "pismo", "gold": ["pisma"], "filled": "Stigla su tri pisma iz inostranstva.", "explanation": "Paukal uz broj 3 za imenice srednjeg roda."}, {"id": "srb-idioms-idiomi-c-0011", "task": "srb_idioms", "category": "idiomi-c", "kind": "mcq", "question": "Šta znači izraz „trla baba lan da joj prođe dan\"?", "choices": ["naporno raditi od jutra do mraka", "obavljati važan posao na vreme", "brižljivo se starati o domaćinstvu", "baviti se beskorisnim poslom samo da bi vreme prošlo"], "gold": ["D"], "explanation": "Izreka označava bavljenje nekorisnim, beznačajnim poslom samo da bi vreme prošlo, bez stvarne svrhe ili koristi."}, {"id": "srb-cyrillic-agreement-geografija-0008-cyr", "task": "srb_cyrillic_agreement", "category": "geografija", "kind": "mcq", "question": "Која је најдужа река у Европи?", "choices": ["Дунав", "Рајна", "Волга", "Сена"], "gold": ["C"], "explanation": "Чињенично питање; тачан одговор је независан од писма."}, {"id": "srb-grammar-glagolski-vid-0001", "task": "srb_grammar", "category": "glagolski-vid", "kind": "mcq", "question": "U kojoj rečenici je glagolski vid upotrebljen pravilno?", "choices": ["Juče sam najzad rešavao taj jedan zadatak i predao test.", "Juče sam najzad rešio taj jedan zadatak i predao test.", "Juče sam najzad rešavao taj jedan zadatak i predavao test.", "Juče sam najzad rešavati taj jedan zadatak i predao test."], "gold": ["B"], "explanation": "Jednokratna, dovršena radnja („najzad“, jedan zadatak) traži svršeni vid „rešio“; nesvršeno „rešavao“ označava trajanje ili ponavljanje, što ovde ne odgovara."}, {"id": "srb-cloze-padezi-0005", "task": "srb_grammar_cloze", "category": "padezi", "kind": "cloze", "question": "U kući nema više ____.", "cue": "hleb", "gold": ["hleba"], "filled": "U kući nema više hleba.", "explanation": "Odrična egzistencijalna konstrukcija „nema“ traži genitiv."}, {"id": "srb-idioms-idiomi-b-0007", "task": "srb_idioms", "category": "idiomi-b", "kind": "mcq", "question": "U kojoj rečenici je izraz pravilno napisan?", "choices": ["Nije fer da ja stalno vadim kestenje iz vatre umesto njega.", "Nije fer da ja stalno vadim kostenje iz vatre umesto njega.", "Nije fer da ja stalno vadijem kestenje iz vatre umesto njega.", "Nije fer da ja stalno vadim kestenje iz vatri umesto njega."], "gold": ["A"], "explanation": "Frazeologizam glasi „vaditi kestenje iz vatre“; „kostenje“ je pogrešan oblik imenice, „vadijem“ je nepravilan prezent, a „iz vatri“ ima pogrešan padežni nastavak."}, {"id": "srb-cyrillic-agreement-priroda-0011-cyr", "task": "srb_cyrillic_agreement", "category": "priroda", "kind": "mcq", "question": "Која боја настаје мешањем плаве и жуте боје?", "choices": ["зелена", "љубичаста", "наранџаста", "браон"], "gold": ["A"], "explanation": "Чињенично питање; тачан одговор је независан од писма."}, {"id": "srb-grammar-padezi-0001", "task": "srb_grammar", "category": "padezi", "kind": "mcq", "question": "Koja je rečenica gramatički ispravna prema normi standardnog srpskog jezika?", "choices": ["Pišem pismo sa olovkom koju si mi poklonio.", "Pišem pismo sa olovku koju si mi poklonio.", "Pišem pismo o olovkom koju si mi poklonio.", "Pišem pismo olovkom koju si mi poklonio."], "gold": ["D"], "explanation": "Sredstvo (oruđe) kojim se vrši radnja iskazuje se golim instrumentalom bez predloga „sa“, pa je pravilno „pišem olovkom“; predlog „sa“ uz instrumental označava društvo, a ne sredstvo."}, {"id": "srb-cloze-padezi-0001", "task": "srb_grammar_cloze", "category": "padezi", "kind": "cloze", "question": "Celo popodne sedeli smo u ____ i razgovarali.", "cue": "bašta", "gold": ["bašti"], "filled": "Celo popodne sedeli smo u bašti i razgovarali.", "explanation": "Glagol „sedeti“ označava mirovanje, pa posle predloga „u“ ide lokativ."}, {"id": "srb-idioms-idiomi-c-0003", "task": "srb_idioms", "category": "idiomi-c", "kind": "mcq", "question": "Kada za nekoga kažemo da „ko o čemu, baba o uštipcima\", mislimo da taj čovek:", "choices": ["voli da kuva i priprema jela", "stalno menja mišljenje o svemu", "uporno svodi svaki razgovor na svoju omiljenu temu", "ćuti i ne uključuje se u razgovor"], "gold": ["C"], "explanation": "Izrekom se ismeva onaj ko, o čemu god se govorilo, neprestano provlači svoju opsesivnu temu."}, {"id": "srb-cyrillic-agreement-matematika-0005-lat", "task": "srb_cyrillic_agreement", "category": "matematika", "kind": "mcq", "question": "Koliko strana ima kvadrat?", "choices": ["tri", "pet", "šest", "četiri"], "gold": ["D"], "explanation": "Činjenično pitanje; tačan odgovor je nezavisan od pisma."}, {"id": "srb-grammar-padezi-0008", "task": "srb_grammar", "category": "padezi", "kind": "mcq", "question": "U kojoj je rečenici padež posle predloga „prema“ upotrebljen pravilno?", "choices": ["Bila je ljubazna prema svojih gostiju.", "Bila je ljubazna prema svoje goste.", "Bila je ljubazna prema svojim goste.", "Bila je ljubazna prema svojim gostima."], "gold": ["D"], "explanation": "U značenju odnosa/ophođenja predlog „prema“ slaže se s dativom, pa je pravilno „prema svojim gostima“."}, {"id": "srb-cloze-glagolski-oblici-0016", "task": "srb_grammar_cloze", "category": "glagolski-oblici", "kind": "cloze", "question": "Da sam znao, ____ bih ranije.", "cue": "doći", "gold": ["došao"], "filled": "Da sam znao, došao bih ranije.", "explanation": "Potencijal se gradi od radnog glagolskog prideva: „došao bih“."}, {"id": "srb-idioms-idiomi-b-0005", "task": "srb_idioms", "category": "idiomi-b", "kind": "mcq", "question": "Koja rečenica je pravopisno ispravna?", "choices": ["Posle te investicije je definitivno obrao zelen boštan.", "Posle te investicije je definitivno obrao zelen bostan.", "Posle te investicije je definitivno obro zelen bostan.", "Posle te investicije je definitivno obrao zeleni bostan."], "gold": ["B"], "explanation": "Ustaljeni oblik je „obrati zelen bostan“; „boštan“ je pogrešno napisano, „obro“ je nestandardni sažeti oblik, a „zeleni“ narušava izraz s neodređenim pridevom."}]</script>
<script>
/* LOGIC-START */
const KINDS = {
  ok: { label: "ok", key: "1" }, fix: { label: "ispravka", key: "2" }, add: { label: "+ oblik", key: "3" },
  unsure: { label: "sporno", key: "4" }, drop: { label: "loš item", key: "5" },
};
// The exact sheet format `serbeval verify --apply` parses: "[n] id" then "PROVERA: mark".
function markText(m) {
  if (!m) return "";
  if (m.kind === "ok") return "ok";
  if (m.kind === "unsure") return "?";
  if (m.kind === "drop") return "-";
  if (m.kind === "fix") return "x " + m.value;
  if (m.kind === "add") return "+ " + m.value;
  return "";
}
function serializeMarks(items, marks) {
  const out = ["# serbeval — provera (izvezeno iz HTML-a)", ""];
  items.forEach((it, i) => {
    out.push("[" + (i + 1) + "] " + it.id);
    out.push("PROVERA: " + markText(marks[it.id]));
    out.push("");
  });
  return out.join("\n");
}
function parseMarks(text) {
  const marks = {};
  let current = null;
  for (const raw of text.split(/\r?\n/)) {
    const line = raw.trim();
    const id = line.match(/^\[\d+\]\s+(\S+)/);
    if (id) { current = id[1]; continue; }
    const check = line.match(/^PROVERA:\s*(.*)$/);
    if (check && current) {
      const mark = check[1].split("#")[0].trim();
      const head = mark.split(/\s+/)[0].toLowerCase();
      const rest = mark.slice(head.length).trim();
      if (head === "ok") marks[current] = { kind: "ok" };
      else if (head === "?") marks[current] = { kind: "unsure" };
      else if (head === "-") marks[current] = { kind: "drop" };
      else if (head === "x" && rest) marks[current] = { kind: "fix", value: rest };
      else if (head === "+" && rest) marks[current] = { kind: "add", value: rest };
      current = null;
    }
  }
  return marks;
}
/* LOGIC-END */

const ITEMS = JSON.parse(document.getElementById("items").textContent);
const STORE = "serbeval-verify:" + document.title;
let marks = {};
try { marks = JSON.parse(localStorage.getItem(STORE) || "{}"); } catch (e) { marks = {}; }
let pos = 0;
let editing = null;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function save() { try { localStorage.setItem(STORE, JSON.stringify(marks)); } catch (e) { /* private mode: keep in memory */ } }
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 1400); }

function visible() {
  const cat = $("filter").value;
  const open = $("onlyOpen").checked;
  return ITEMS.map((it, i) => i).filter((i) =>
    (!cat || ITEMS[i].task + " · " + ITEMS[i].category === cat) && (!open || !marks[ITEMS[i].id] || i === pos));
}

function renderCounts() {
  const n = ITEMS.length;
  const c = { ok: 0, fix: 0, add: 0, unsure: 0, drop: 0 };
  Object.values(marks).forEach((m) => { if (c[m.kind] !== undefined) c[m.kind]++; });
  const done = Object.keys(marks).filter((id) => ITEMS.some((it) => it.id === id)).length;
  $("progress").style.width = (100 * done / n) + "%";
  $("counts").textContent = done + "/" + n + " · ok " + c.ok + " · ispravka " + c.fix + " · +oblik " + c.add +
    " · sporno " + c.unsure + " · loš " + c.drop;
}

function sentenceHtml(it) {
  if (it.kind === "mcq") return esc(it.question);
  const parts = it.question.split("____");
  return esc(parts[0]) + "<mark>" + esc(it.gold[0]) + "</mark>" + esc(parts.slice(1).join("____"));
}

function render() {
  const it = ITEMS[pos];
  const m = marks[it.id];
  let body = '<div class="meta"><span>[' + (pos + 1) + "] " + esc(it.id) + "</span><span>" + esc(it.task) + " · " +
    esc(it.category) + '</span><span class="status">' + (m ? "označeno: " + esc(markText(m)) : "neoznačeno") + "</span></div>";
  body += '<div class="sentence">' + sentenceHtml(it) + "</div>";
  if (it.kind === "cloze") {
    body += '<div class="original">' + esc(it.question) + '<span class="cue">' + esc(it.cue) + "</span></div>";
    body += '<div class="gold-box">Tačno: <b>' + it.gold.map(esc).join(" / ") + "</b></div>";
  } else {
    body += '<ol class="choices">' + it.choices.map((c, i) => '<li class="' + ("ABCD"[i] === it.gold[0] ? "gold" : "") +
      '">' + "ABCD"[i] + ") " + esc(c) + "</li>").join("") + "</ol>";
  }
  body += '<div class="explain">' + esc(it.explanation) + "</div>";
  body += '<div class="actions">' + Object.entries(KINDS).map(([k, v]) =>
    '<button class="a-' + k + (m && m.kind === k ? " on" : "") + '" data-kind="' + k + '">' + v.label +
    "<kbd>" + v.key + "</kbd></button>").join("") + "</div>";
  body += '<div class="editor" id="editor"></div>';
  $("card").innerHTML = body;
  $("card").querySelectorAll(".actions button").forEach((b) => b.addEventListener("click", () => choose(b.dataset.kind)));
  renderDots();
  renderCounts();
  editing = null;
}

function renderDots() {
  $("dots").innerHTML = ITEMS.map((it, i) => {
    const m = marks[it.id];
    return '<button title="[' + (i + 1) + "] " + esc(it.id) + '" class="' + (m ? "k-" + m.kind : "") +
      (i === pos ? " cur" : "") + '" data-i="' + i + '"></button>';
  }).join("");
  $("dots").querySelectorAll("button").forEach((b) => b.addEventListener("click", () => go(Number(b.dataset.i))));
}

function setMark(kind, value) {
  const id = ITEMS[pos].id;
  marks[id] = value === undefined ? { kind } : { kind, value };
  save();
  render();
  advance();
}

function choose(kind) {
  const it = ITEMS[pos];
  if (kind === "ok" || kind === "unsure" || kind === "drop") return setMark(kind);
  const ed = $("editor");
  ed.classList.add("open");
  editing = kind;
  if (it.kind === "mcq") {
    if (kind === "add") { ed.innerHTML = '<span class="explain">„+ oblik“ važi samo za dopunu; za ponuđene odgovore koristi ispravku.</span>'; return; }
    ed.innerHTML = '<span>Tačno slovo:</span><span class="letters">' + "ABCD".split("").map((l) =>
      '<button data-l="' + l + '">' + l + "</button>").join(" ") + "</span>";
    ed.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => setMark("fix", b.dataset.l)));
    return;
  }
  const prior = marks[it.id] && marks[it.id].kind === kind ? marks[it.id].value : (kind === "fix" ? it.gold.join(" / ") : "");
  ed.innerHTML = '<span>' + (kind === "fix" ? "Ispravni oblici (odvoji „ / “):" : "Dodatni tačan oblik:") +
    '</span><input type="text" id="editValue" value="' + esc(prior) + '"><button class="primary" id="editOk">Potvrdi</button>';
  const input = $("editValue");
  input.focus(); input.select();
  const commit = () => { const v = input.value.trim(); if (v) setMark(kind, v); };
  $("editOk").addEventListener("click", commit);
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") commit(); if (e.key === "Escape") render(); e.stopPropagation(); });
}

function go(i) { pos = Math.max(0, Math.min(ITEMS.length - 1, i)); render(); }
function step(d) {
  const v = visible();
  const at = v.indexOf(pos);
  const next = v[at + d];
  if (next !== undefined) go(next);
}
function advance() {
  const v = visible().filter((i) => !marks[ITEMS[i].id]);
  const after = v.find((i) => i > pos);
  if (after !== undefined) go(after);
  else if (v.length) go(v[0]);
  else toast("Sve je označeno — preuzmi fajl.");
}

function exportSheet() {
  const blob = new Blob([serializeMarks(ITEMS, marks)], { type: "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = document.title + ".txt";
  a.click();
  URL.revokeObjectURL(a.href);
}

$("filter").innerHTML = '<option value="">Sve kategorije (' + ITEMS.length + ")</option>" +
  [...new Set(ITEMS.map((it) => it.task + " · " + it.category))].map((c) =>
    '<option value="' + esc(c) + '">' + esc(c) + " (" + ITEMS.filter((it) => it.task + " · " + it.category === c).length +
    ")</option>").join("");
$("filter").addEventListener("change", () => { const v = visible(); if (v.length) go(v[0]); });
$("onlyOpen").addEventListener("change", render);
$("prev").addEventListener("click", () => step(-1));
$("next").addEventListener("click", () => step(1));
$("nextOpen").addEventListener("click", advance);
$("exportBtn").addEventListener("click", exportSheet);
$("importBtn").addEventListener("click", () => $("importFile").click());
$("importFile").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const loaded = parseMarks(await file.text());
  Object.assign(marks, loaded);
  save(); render();
  toast("Učitano " + Object.keys(loaded).length + " oznaka.");
});
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT" || e.metaKey || e.ctrlKey) return;
  const kind = Object.keys(KINDS).find((k) => KINDS[k].key === e.key);
  if (kind) { e.preventDefault(); choose(kind); }
  else if (e.key === "0") { delete marks[ITEMS[pos].id]; save(); render(); }
  else if (e.key === "ArrowRight" || e.key === "j") step(1);
  else if (e.key === "ArrowLeft" || e.key === "k") step(-1);
});
const firstOpen = ITEMS.findIndex((it) => !marks[it.id]);
go(firstOpen === -1 ? 0 : firstOpen);
</script>
</body>
</html>
