[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "serbeval"
version = "0.1.0"
description = "Serbian-language evaluation benchmark for LLMs, built on lm-evaluation-harness"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Djordje Markovic" }]
dependencies = [
    "lm-eval[api]==0.4.12",
    "anthropic>=0.69",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "mypy>=1.10",
    "ruff>=0.6",
]

[project.scripts]
serbeval = "serbeval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: integration tests that import lm_eval and load real datasets"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src"]
# lm_eval ships no type stubs
[[tool.mypy.overrides]]
module = "lm_eval.*"
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# This is a Serbian-language project: Cyrillic/Latin look-alike characters in string
# literals are intentional, not typos.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# One-shot data-builder scripts contain long inline data tables.
"scripts/*.py" = ["E501"]
